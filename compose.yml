services:
  postgres:
    image: postgres:18-alpine
    container_name: task_manager_postgres_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: tsk_mgr_usr
      POSTGRES_PASSWORD: tsk_mgr_pass_123
      POSTGRES_DB: task_manager_database
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data: